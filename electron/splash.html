<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>JARVIS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #040711;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-app-region: drag;
  }
  .core {
    position: relative;
    width: 96px;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px dashed rgba(34, 211, 238, 0.5);
    animation: spin 6s linear infinite;
  }
  .ring.inner {
    inset: 14px;
    border: 2px solid rgba(56, 189, 248, 0.7);
    border-style: solid;
    animation: spin-rev 4s linear infinite;
  }
  .dot {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #e0ffff, #22d3ee 55%, #0e7490 100%);
    box-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.85); opacity: 0.75; }
  }
  .title {
    margin-top: 22px;
    font-size: 13px;
    letter-spacing: 0.35em;
    font-weight: 700;
    color: #67e8f9;
    text-transform: uppercase;
  }
  .status {
    margin-top: 8px;
    font-size: 11px;
    color: #64748b;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="core">
      <div class="ring"></div>
      <div class="ring inner"></div>
      <div class="dot"></div>
    </div>
    <div class="title">JARVIS</div>
    <div class="status" id="status">Booting neural gateway…</div>
  </div>
  <script>
    // The main process can update this via executeJavaScript for finer-grained
    // status; harmless no-op if it never does.
    window.setSplashStatus = (text) => {
      const el = document.getElementById('status');
      if (el) el.textContent = text;
    };
  </script>
</body>
</html>
